name: Materialize Red Leaf screenshots

on:
  push:
    paths:
      - ".github/workflows/materialize-redleaf-assets.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Rebuild screenshot assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/projects/red-leaf

          cat .redleaf-assets/library/*.b64 | base64 --decode > public/assets/projects/red-leaf/library.webp
          cat .redleaf-assets/story/*.part > public/assets/projects/red-leaf/story-modal.webp
          cat .redleaf-assets/gameplay/*.part > public/assets/projects/red-leaf/gameplay.webp

          test -s public/assets/projects/red-leaf/library.webp
          test -s public/assets/projects/red-leaf/story-modal.webp
          test -s public/assets/projects/red-leaf/gameplay.webp

      - name: Commit real screenshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .redleaf-assets
          git rm .github/workflows/materialize-redleaf-assets.yml
          git add public/assets/projects/red-leaf/*.webp
          git commit -m "Add Red Leaf product screenshots"
          git push origin HEAD:${{ github.ref_name }}
