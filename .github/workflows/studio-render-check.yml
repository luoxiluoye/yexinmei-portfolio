name: Studio render check
on:
  push:
    branches: [codex/portfolio-3d-studio-20260923]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-render-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.studio-qa/browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Read framework conventions
        run: cat node_modules/next/dist/docs/01-app/03-api-reference/01-directives/use-client.md | head -120
      - name: Package local modeling review resources
        run: |
          mkdir -p .studio-qa/results .studio-qa/tmp
          zip -qr .studio-qa/results/model-review-resources.zip components/portfolio styles/portfolio-studio-page.css styles/portfolio-interactions.css node_modules/three node_modules/typescript public/assets/photos public/assets/projects/red-leaf/gameplay-scene-hires.png node_modules/next/dist/docs/01-app/03-api-reference/01-directives/use-client.md
      - run: npm run assets:verify && npm run build
      - run: npm install --no-save playwright@1.55.1 && npx playwright install --with-deps chromium
      - name: Browser render and interaction checks
        timeout-minutes: 11
        env:
          TMPDIR: ${{ github.workspace }}/.studio-qa/tmp
        run: |
          npm run start > .studio-qa/server.log 2>&1 &
          node scripts/qa-studio-model.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-browser-evidence
          path: .studio-qa/results/
          retention-days: 7
