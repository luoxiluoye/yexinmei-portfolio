name: Player Snapshot Visual QA

on:
  push:
    branches:
      - player-journey-modal-fix
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture desktop and mobile
        env:
          PLAYER_URL: https://yexinmei-portfolio-git-player-j-af5caf-luoyes-projects-a7639a71.vercel.app/player
        run: |
          mkdir -p qa-screenshots
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });

            async function capture(name, viewport) {
              const page = await browser.newPage({ viewport });
              await page.goto(process.env.PLAYER_URL, { waitUntil: 'networkidle', timeout: 90000 });
              await page.screenshot({ path: `qa-screenshots/${name}.png`, fullPage: false });
              await page.close();
            }

            await capture('player-desktop-1440', { width: 1440, height: 1000 });
            await capture('player-mobile-390', { width: 390, height: 844 });
            await browser.close();
          })();
          NODE

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: player-snapshot-visual-qa
          path: qa-screenshots/*.png
          if-no-files-found: error
          retention-days: 1
